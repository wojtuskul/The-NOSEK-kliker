<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOSEK Kliker z Firebase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 40px;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
    }
    input, button {
      padding: 10px;
      margin: 5px;
      font-size: 1em;
    }
    #score {
      font-size: 3em;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>🔥 NOSEK KLIKER z logowaniem</h1>

  <div>
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Hasło" />
    <br>
    <button id="registerBtn">Zarejestruj</button>
    <button id="loginBtn">Zaloguj</button>
  </div>

  <h2>Twój wynik:</h2>
  <div id="score">0</div>

  <button id="clickBtn">Kliknij mnie!</button>
  <button id="saveBtn">💾 Zapisz wynik</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZ9D-a_rbzX2iXSKzXjplPINmUsAuU_bE",
      authDomain: "baza-do-nosek-kliker.firebaseapp.com",
      projectId: "baza-do-nosek-kliker",
      storageBucket: "baza-do-nosek-kliker.appspot.com",
      messagingSenderId: "686158397381",
      appId: "1:686158397381:web:c407db3f4e317d9b2d95ac",
      databaseURL: "https://baza-do-nosek-kliker-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let score = 0;
    let userId = null;

    const scoreDisplay = document.getElementById("score");

    document.getElementById("registerBtn").onclick = () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => alert("Zarejestrowano!"))
        .catch(error => alert("Błąd: " + error.message));
    };

    document.getElementById("loginBtn").onclick = () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => alert("Zalogowano!"))
        .catch(error => alert("Błąd logowania: " + error.message));
    };

    document.getElementById("clickBtn").onclick = () => {
      score++;
      scoreDisplay.textContent = score;
    };

    document.getElementById("saveBtn").onclick = () => {
      if (!userId) {
        alert("Zaloguj się najpierw!");
        return;
      }
      set(ref(db, "scores/" + userId), {
        score: score
      }).then(() => {
        alert("Zapisano wynik!");
      });
    };

    onAuthStateChanged(auth, user => {
      if (user) {
        userId = user.uid;
        const userScoreRef = ref(db, "scores/" + userId);
        get(userScoreRef).then(snapshot => {
          if (snapshot.exists()) {
            score = snapshot.val().score || 0;
            scoreDisplay.textContent = score;
          } else {
            score = 0;
            scoreDisplay.textContent = score;
          }
        });
      } else {
        userId = null;
      }
    });
  </script>
</body>
</html>
